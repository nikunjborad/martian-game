  const top=Object.entries(L.score).map(([id,p])=>[M(+id),p]).filter(x=>x[0]).sort((a,b)=>b[1]-a[1])[0];
  return{year:y,paras:out,star:top?{name:top[0].name,job:top[0].job!=='none'?JOBS[top[0].job].name:'',line:top[0].lineage}:null,sol:solNum()};

/* ================= isometric 3D rendering =================

  balanced:{name:'Balanced',desc:'Good for phones. A sharp-enough picture at 30 frames a second, with up to 30 martians drawn.',dpr:1.5,fps:30,idleFps:12,maxM:30,relight:1100,glow:true,parts:0.6,uiMs:900},
  sharp:{name:'Sharp',desc:'Best picture at full frame rate, with every martian drawn. Best on computers.',dpr:2,fps:60,idleFps:30,maxM:400,relight:400,glow:true,parts:1,uiMs:450}};
const mq=q=>typeof matchMedia!=='undefined'&&matchMedia(q).matches;
const PHONE_Q='(max-width:760px),(pointer:coarse) and (max-height:520px)',SIDE_Q='(pointer:coarse) and (max-height:520px)';
function autoGfx(){const small=typeof screen!=='undefined'&&Math.max(screen.width||0,screen.height||0)<1100;return mq(PHONE_Q)||(mq('(pointer:coarse)')&&small)?'balanced':'sharp'}
const gfxKey=()=>{const g=S&&S.settings&&S.settings.gfx;return GFX_LEVELS[g]?g:autoGfx()};
let GFX=GFX_LEVELS.sharp;
function resize(){
  GFX=GFX_LEVELS[gfxKey()];UI.phone=mq(PHONE_Q);UI.side=mq(SIDE_Q);
  const w=cv.parentElement;DPR=Math.min(GFX.dpr,window.devicePixelRatio||1);
  UI.cw=Math.max(240,w.clientWidth);UI.ch=Math.max(200,w.clientHeight);
  cv.width=Math.round(UI.cw*DPR);cv.height=Math.round(UI.ch*DPR);gcKey='';
}
function setGfx(k){S.settings.gfx=k;resize();toast(`Graphics: ${GFX.name}.`,'info')}
const hx=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const mixA=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgba=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const COLC={};const col=h=>Array.isArray(h)?h:(COLC[h]||(COLC[h]=hx(h)));
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

/* ---------- camera ---------- */
const COS30=Math.cos(Math.PI/6);
const VIEW=[COS30/Math.SQRT2,COS30/Math.SQRT2,0.5]; // direction from the scene toward the camera
const CAM={a:28,b:14,c:34,ox:0,oy:0,zoom:1,fx:16,fy:16};
const VIEW_TILES=16;
function updateCam(){
  const W=UI.cw,H=UI.ch,n=VIEW_TILES*2;

  CAM.fx=clamp(CAM.fx,0,MAP_W);CAM.fy=clamp(CAM.fy,0,MAP_H);

  CAM.oy=H/2+CAM.c*0.45-(CAM.fx+CAM.fy)*CAM.b+(CAM.sy||0);

function panBy(du,dv){CAM.fx-=(du/CAM.a+dv/CAM.b)/2;CAM.fy-=(dv/CAM.b-du/CAM.a)/2}
function focusOn(x,y){CAM.fx=x;CAM.fy=y}
// GZ lifts whatever is being drawn onto the ground beneath it
let GZ=0;
const P=(x,y,z=0)=>[CAM.ox+(x-y)*CAM.a,CAM.oy+(x+y)*CAM.b-(z+GZ)*CAM.c];
function unprojT(u,v){let g=unproj(u,v);for(let k=0;k<3;k++){const h=hAt(g.x,g.y);g=unproj(u,v+h*CAM.c)}return g}
const SEA_C=hx('#3F6C8C'),LAKE_C=hx('#4E88A8'),ICE_C=hx('#CFE2EC'),MTN_C=hx('#7A5C58');
function tileN(x,y){const hc=S.map.hc,W1=MAP_W+1;if(!hc)return[0,0,1];const a=hc[y*W1+x],b=hc[y*W1+x+1],c2=hc[(y+1)*W1+x],d=hc[(y+1)*W1+x+1];
  return norm3([-((b+d)-(a+c2))*0.9,-((c2+d)-(a+b))*0.9,1])}
function drawPeak(x,y,k){const cx=x+0.5,cy=y+0.5,h=[0,1.0,1.55,2.2][k],r=0.6+0.08*k,rot=hash2(x,y,3)*1.2;

  cone(cx,cy,-0.05,r,h,'#86686A',5,1,rot);
  if(k>=2||seasonIdx()===3)cone(cx,cy,h*0.6-0.05,r*0.4,h*0.4,'#EEE8F0',5,1,rot)}
function unproj(u,v){const du=(u-CAM.ox)/CAM.a,dv=(v-CAM.oy)/CAM.b;return{x:(du+dv)/2,y:(dv-du)/2}}
function zoomAt(p,f){

  const [u,v]=P(g.x,g.y,0);panBy(p.x-u,p.y-v);updateCam();

function visRange(m=2){
  const W=UI.cw,H=UI.ch,pts=[unproj(-40,-CAM.c*3),unproj(W+40,-CAM.c*3),unproj(-40,H+CAM.c*2),unproj(W+40,H+CAM.c*2)];

}
const onScreen=(x,y,pad)=>{const [u,v]=P(x,y);const p=(pad??3)*CAM.a;return u>-p&&u<(UI.cullW??UI.cw)+p&&v>-p*1.5&&v<(UI.cullH??UI.ch)+p}

/* ---------- light: the sun crosses in front of the camera, so lit faces stay in view ---------- */
const L={sun:[0.5,0.5,0.7],str:1,amb:[1,1,1],sunCol:[1,1,1],night:0,t:0};
const AMB={day:hx('#FFE9CC'),dawn:hx('#F2C2A8'),dusk:hx('#B4CCF6'),night:hx('#8A7CBE')};
function updateLight(t){
  const n=nightness(t);L.night=n;L.t=t;
  const p=(t-0.07)/0.65;
  if(p>0&&p<1){
    const az=-Math.PI/4+p*Math.PI,el=0.1+Math.sin(Math.PI*p)*0.95;
    L.sun=[Math.cos(az)*Math.cos(el),Math.sin(az)*Math.cos(el),Math.sin(el)];
    const low=clamp(1-Math.sin(Math.PI*p)*2.2,0,1);
    L.str=clamp(Math.sin(Math.PI*p)*2.5,0,1)*0.95;
    L.sunCol=mixA([1,0.95,0.86],[0.8,0.9,1.0],low); // Martian sunsets are blue
  }else{L.sun=norm3([0.25,0.7,0.75]);L.str=0.25;L.sunCol=[0.65,0.72,1]}
  let a;
  if(t<0.05||t>=0.77)a=AMB.night;
  else if(t<0.11)a=mixA(AMB.night,AMB.dawn,(t-0.05)/0.06);
  else if(t<0.18)a=mixA(AMB.dawn,AMB.day,(t-0.11)/0.07);
  else if(t<0.56)a=AMB.day;
  else if(t<0.66)a=mixA(AMB.day,AMB.dusk,(t-0.56)/0.1);
  else if(t<0.7)a=AMB.dusk;
  else a=mixA(AMB.dusk,AMB.night,clamp((t-0.7)/0.09,0,1));

function shadeArr(base,nrm){const d=Math.max(0,dot3(nrm,L.sun));return[0,1,2].map(i=>Math.min(255,base[i]*(L.amb[i]*0.62+L.sunCol[i]*d*L.str*0.62)))}

/* ---------- primitives ---------- */
function pathPts(pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath()}

function box(x,y,z,sx,sy,sz,h,top,al=1){

/* ================= sound, generated in code =================
   Soft pads and a wandering pentatonic melody that shift with the time of day and the
   season, a Martian wind that swells in storms, and small chimes for things that happen.
   Nothing plays until you first touch the page, as browsers require. */
const AUD={ctx:null,master:null,music:null,fx:null,windGain:null,timer:null,next:0,step:0,mel:2};
const soundMode=()=>(!S||!S.settings)?0:S.settings.music?2:S.settings.sfx?1:0;
function makeImpulse(c,dur,decay){const len=Math.floor(c.sampleRate*dur),b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
function ensureAudio(){
  if(AUD.ctx||typeof window==='undefined')return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const c=new AC();AUD.ctx=c;
    AUD.master=c.createGain();AUD.master.gain.value=0.7;AUD.master.connect(c.destination);
    const rev=c.createConvolver();rev.buffer=makeImpulse(c,3,2.4);const rg=c.createGain();rg.gain.value=0.4;rev.connect(rg);rg.connect(AUD.master);
    AUD.music=c.createGain();AUD.music.gain.value=0;AUD.music.connect(AUD.master);AUD.music.connect(rev);
    AUD.fx=c.createGain();AUD.fx.gain.value=0.45;AUD.fx.connect(AUD.master);AUD.fx.connect(rev);
    // the wind: looping noise through a slowly wandering band-pass filter
    const nb=c.createBuffer(1,c.sampleRate*3,c.sampleRate),nd=nb.getChannelData(0);let last=0;for(let i=0;i<nd.length;i++){last=last*0.97+(Math.random()*2-1)*0.03;nd[i]=last*3}
    const src=c.createBufferSource();src.buffer=nb;src.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=0.7;
    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=0.07;lg.gain.value=220;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
    AUD.windGain=c.createGain();AUD.windGain.gain.value=0;src.connect(bp);bp.connect(AUD.windGain);AUD.windGain.connect(AUD.master);src.start();
    AUD.next=c.currentTime+0.3;AUD.timer=setInterval(musicTick,200);
  }catch(e){AUD.ctx=null}
}
function resumeAudio(){ensureAudio();if(AUD.ctx&&AUD.ctx.state==='suspended')AUD.ctx.resume().catch(()=>{})}
const hz=n=>440*Math.pow(2,n/12); // n = semitones from A4
function playTone(f,t,dur,o={}){
  const c=AUD.ctx;if(!c)return;const osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.glide)osc.frequency.exponentialRampToValueAtTime(o.glide,t+dur*0.8);if(o.detune)osc.detune.value=o.detune;
  const peak=o.gain??0.1,att=o.attack??0.02;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let out=g;if(o.lp){const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o.lp;g.connect(lp);out=lp}
  osc.connect(g);out.connect(o.dest||AUD.music);osc.start(t);osc.stop(t+dur+0.05);
}
const BEAT=0.75;
function musicMood(){
  const t=phase().t,winter=seasonIdx()===3;
  if(t>=0.14&&t<0.6)return{root:-12,scale:[0,2,4,7,9],chords:[[0,4,7],[7,11,14],[9,12,16],[5,9,12]],bells:winter};   // daytime: A major, gentle
  if(t>=0.6&&t<0.78)return{root:-14,scale:[0,2,4,7,9],chords:[[0,4,7],[5,9,12],[9,12,16],[7,11,14]],bells:true};    // blue dusk: G major, wistful
  return{root:-15,scale:[0,3,5,7,10],chords:[[0,3,7],[8,12,15],[3,7,10],[10,14,17]],bells:winter};                   // night: F# minor, hushed
}
function musicTick(){
  const c=AUD.ctx;if(!c||!S)return;const mode=soundMode(),now=c.currentTime;
  AUD.music.gain.setTargetAtTime(mode===2?0.22:0,now,0.6);
  AUD.windGain.gain.setTargetAtTime(mode>=1?(S.ev&&S.ev.storm>0?0.3:0.035):0,now,1.2);
  if(mode<2){AUD.next=Math.max(AUD.next,now+0.2);return}
  while(AUD.next<now+0.8){
    const t=AUD.next,mo=musicMood(),st=AUD.step;
    if(st%8===0){const ch=mo.chords[(st/8|0)%mo.chords.length];
      for(const n of ch)for(const det of [-6,6])playTone(hz(mo.root+n),t,BEAT*8.5,{type:'triangle',gain:0.022,attack:2.2,detune:det,lp:900});
      playTone(hz(mo.root+ch[0]-12),t,BEAT*8.5,{type:'sine',gain:0.03,attack:2.5})}
    if(Math.random()<0.32){AUD.mel=clamp(AUD.mel+pick([-2,-1,-1,1,1,2]),0,9);const sc=mo.scale,n=sc[AUD.mel%5]+12*Math.floor(AUD.mel/5);
      playTone(hz(mo.root+12+n),t+Math.random()*0.08,1.8,{type:'sine',gain:0.045,attack:0.05})}
    if(mo.bells&&Math.random()<0.08){const n=pick(mo.scale);playTone(hz(mo.root+36+n),t,2.6,{type:'triangle',gain:0.018,attack:0.01})}
    AUD.next+=BEAT;AUD.step++;
  }
}
function sfx(name){
  if(!AUD.ctx||soundMode()<1)return;const t=AUD.ctx.currentTime+0.02,d=AUD.fx;
  const seq=(notes,gap,o)=>notes.forEach((n,i)=>playTone(hz(n),t+i*gap,o.dur||0.6,{...o,dest:d}));
  switch(name){
    case'build':seq([3,10],0.12,{type:'triangle',gain:0.12,dur:0.7});break;
    case'upgrade':seq([3,7,10,15],0.09,{type:'triangle',gain:0.09,dur:0.55});break;
    case'bud':playTone(hz(-5),t,0.4,{gain:0.14,glide:hz(7),dest:d});playTone(hz(7),t+0.22,0.35,{gain:0.08,glide:hz(14),dest:d});break;
    case'invent':seq([19,22,27,31],0.07,{gain:0.06,dur:1.1});break;
    case'vote':seq([-2,3,7],0.14,{type:'triangle',gain:0.1,dur:0.8});break;
    case'chime':seq([12,19],0.16,{gain:0.07,dur:1.2});break;
    case'coin':seq([22,27],0.06,{type:'triangle',gain:0.05,dur:0.25});break;
    case'sad':seq([-12,-14,-17],0.35,{gain:0.07,dur:1.8});break;
    case'fanfare':seq([3,7,10,15,19],0.11,{type:'triangle',gain:0.1,dur:1});playTone(hz(-9),t+0.5,2.5,{type:'sine',gain:0.08,dest:d});break;
    case'storm':if(AUD.windGain)AUD.windGain.gain.setTargetAtTime(0.32,AUD.ctx.currentTime,0.8);break;
    case'click':playTone(hz(27),t,0.05,{gain:0.025,attack:0.004,dest:d});break;
  }
}

// split a panel into tabs at its headings: everything before the first heading stays on top
function sectionize(box,key,map,alerts){
  const kids=[...box.children],first=kids.findIndex(k=>k.tagName==='H3');if(first<0)return;
  const groups=[],by={};let cur=null;
  for(let i=first;i<kids.length;i++){const k=kids[i];
    if(k.tagName==='H3'){const raw=k.dataset.sec||secName(k.textContent),g=(map&&map[raw])||raw;
      if(!by[g]){const el=document.createElement('div');el.className='sec';by[g]={name:g,label:k.dataset.label||g,el};groups.push(by[g])}cur=by[g]}
    cur.el.appendChild(k);
  }
  let sel=UI.secSel[key];if(!by[sel])sel=groups[0].name;
  if(groups.length>1){const bar=document.createElement('div');bar.className='secbar';bar.setAttribute('role','tablist');
    bar.innerHTML=groups.map(g=>`<button role="tab" data-act="sec" data-key="${esc(key)}" data-sec="${esc(g.name)}" aria-selected="${g.name===sel}">${esc(g.label)}${alerts&&alerts[g.name]?'<span class="dot" aria-label="needs attention"></span>':''}</button>`).join('');
    box.appendChild(bar)}
  for(const g of groups){g.el.hidden=g.name!==sel;box.appendChild(g.el);
    // the tab already names the section, so its own first heading would just repeat it
    const h=groups.length>1&&g.el.firstElementChild;if(h&&h.tagName==='H3'&&secName(h.textContent)===g.label)h.classList.add('sech')}
}

function sparkline(){
  const hs=[...S.ledger.history.map(x=>x.treasury),S.treasury];if(hs.length<2)return'';
  const mn=Math.min(...hs),mx=Math.max(...hs),w=120,hh=34;
  const pts=hs.map((v,i)=>`${(i/(hs.length-1)*w).toFixed(1)},${(hh-(mx===mn?hh/2:(v-mn)/(mx-mn)*hh)).toFixed(1)}`).join(' ');
  return`<svg width="${w}" height="${hh+4}" viewBox="0 -2 ${w} ${hh+4}" aria-label="Treasury over recent sols"><polyline points="${pts}" fill="none" stroke="#F2B866" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function renderInspector(force){

  const who=UI.sel.kind+(UI.sel.id??(UI.sel.tx+','+UI.sel.ty)),fresh=who!==UI.insWho;UI.insWho=who;
  if(force||html!==UI.lastIns||box.hidden||fresh){const st=box.hidden||UI.secReset||fresh?0:box.scrollTop,ob=box.querySelector('.secbar'),sl=ob?ob.scrollLeft:0;
    box.hidden=false;box.innerHTML=`<button class="x" data-act="close" aria-label="Close">×</button>`+html;UI.lastIns=html;
    sectionize(box,key);const nb=box.querySelector('.secbar');if(nb)nb.scrollLeft=sl;box.scrollTop=st}

  let wx=0,wy=0;

  else if(UI.sel.kind==='rock'||UI.sel.kind==='feat'){wx=UI.sel.tx+0.5;wy=UI.sel.ty+0.5}
  else{const b=B(UI.sel.id);if(b){wx=b.tx+b.size/2;wy=b.ty+b.size/2}}
  box.classList.toggle('right',P(wx,wy)[0]<UI.cw*0.45);
  $('.camctl').classList.toggle('left',box.classList.contains('right'));
}

    ${d.wonder&&!b.built?`<p class="d"><b>${wonderTitle(b)}</b>: ◈ ${fmt(b.fund||0)} of ◈ ${fmt(b.fundNeed)} funded.${wonderGated(b)?' The sculptors are waiting for more funding.':''}</p>${bar((b.fund||0)/Math.max(1,b.fundNeed)*100,'var(--sunset)')}

    ${b.type==='hearthstone'&&C(b.comm)?`<div class="actions"><button class="btn small soft" data-act="tab" data-tab="communities">Open ${esc(C(b.comm).name)}</button></div>`:''}`;

    h+=`<p class="d">With these workers it makes about ${Object.entries(d.out).map(([k,r])=>`${k==='sky'?(r*est*WORK_TICKS).toFixed(1)+'%':Math.round(r*est*WORK_TICKS)} ${k==='sky'?'sky':resName(k)}`).join(' and ')} a sol.</p>`}

    if(b.built&&b.workers.length<slotsOf(b))h+=`<div class="actions"><button class="btn small" data-act="fill" data-id="${b.id}">Add the best free martian</button></div>`;

  if(b.type==='burrow'&&b.residents.length)h+=`<h3>Living here</h3><p class="d">${b.residents.map(id=>M(id)).filter(Boolean).map(m=>esc(m.name)).join(', ')}</p>`;
  if(b.patron&&M(b.patron))h+=`<p class="d" style="margin-top:8px">Patron: ${esc(M(b.patron).name)}. <button class="btn small soft" data-act="revoke" data-id="${b.id}">Buy back for ◈ ${Math.round(patronPrice(b)*1.2)}</button></p>`;
  if(b.built&&!b.upg&&b.level<3&&!b.buried&&!b.damaged){const uc=upCost(b);
    h+=`<div class="actions"><button class="btn small" data-act="upgrade" data-id="${b.id}" ${costMissing(uc)?'disabled':''}>Upgrade to level ${b.level+1}</button><span class="cost" style="align-self:center">${costHtml(uc)}</span></div>
      <p class="d">${b.type==='burrow'?'Adds two beds.':b.type==='hearthstone'?"Widens the community's land.":'Adds a work spot and 25% more output.'}</p>`}

  h+=`<div class="actions"><button class="btn small danger" data-act="demolish" data-id="${b.id}">${confirm?'Click again to take it down':'Take down'}</button></div>`;
  return h;
}

function demolish(b){

  const refund=Math.round(d.cost.glint*0.4*(b.built?1:1.5));S.treasury+=refund;led('construction',refund);
  const nm=bName(b);
  for(let y=0;y<b.size;y++)for(let x=0;x<b.size;x++)S.map.occ[T(b.tx+x,b.ty+y)]=null;delete S.buildings[b.id];LV.b++;
  bumpTerr();
  if(b.type==='hearthstone'){const cm=C(b.comm);if(cm&&!cm.home){const to=nearestComm(cm.cx,cm.cy);delete S.comms[cm.id];for(const o of allC())delete o.rel[cm.id];
    for(const m of allM()){if(m.comm===cm.id)m.comm=nearestComm(m.x,m.y);if(m.moving===cm.id)m.moving=null}for(const x of allB())if(x.comm===cm.id)x.comm=nearestComm(x.tx,x.ty);
    chronicle(`${cm.name} is no more. Its folk joined their neighbors.`,'warn')}else if(cm){cm.hearth=null}}

    if(v==='none')assignJob(m,'none',null);
    else if(v==='sculptor')assignJob(m,'sculptor',null);
    else{const b=B(+v.slice(2));if(b){if(b.workers.length>=slotsOf(b)&&!b.workers.includes(m.id)){toast('That building is full.','warn')}else assignJob(m,BUILD[b.type].job,b.id)}}
    const j=m.job;chronicle(j==='none'?`${m.name} is wandering for now.`:`${m.name} took up the calling of ${JOBS[j].name}.`,'info');
    el.blur();
  }
  refreshUI(true);
}

/* ================= refresh ================= */
function uiFrozen(){const ae=document.activeElement;return UI.pointerDown||(ae&&ae.tagName==='SELECT')}
function refreshUI(force){
  renderTop();renderTabs();renderChronicle();
  if(!force&&(uiFrozen()||performance.now()-(UI.lastScroll||0)<800))return;
  const ae=document.activeElement;let fsel=null;
  if(ae&&ae!==document.body&&(ae.closest('#panel')||ae.closest('#inspector'))){
    const attrs=[...ae.attributes].filter(a=>a.name.startsWith('data-')).map(a=>`[${a.name}="${CSS.escape(a.value)}"]`).join('');
    if(attrs)fsel=(ae.closest('#panel')?'#panel ':'#inspector ')+ae.tagName.toLowerCase()+attrs;
  }
  const p=$('#panel');
  if(!UI.phone||UI.sheet){
    const html=({build:renderBuild,martians:renderMartians,communities:renderCommunities,market:renderMarket,projects:renderProjects,ideas:renderIdeas,laws:renderLaws,tasks:renderTasks,news:renderNews,more:renderMore,nations:renderNations,nature:renderNature,minds:renderMinds}[UI.tab]||renderBuild)();
    if(force||html!==UI.lastPanel){
      const st=UI.secReset?0:p.scrollTop,ob=p.querySelector('.secbar'),sl=ob?ob.scrollLeft:0;
      p.innerHTML=html;UI.lastPanel=html;sectionize(p,'tab:'+UI.tab,SEC_GROUPS[UI.tab],secAlerts(UI.tab));
      const nb=p.querySelector('.secbar');if(nb){nb.scrollLeft=sl;if(UI.secReset){const on=nb.querySelector('[aria-selected="true"]');if(on&&(on.offsetLeft<nb.scrollLeft||on.offsetLeft+on.offsetWidth>nb.scrollLeft+nb.clientWidth))nb.scrollLeft=on.offsetLeft-12}}
      p.scrollTop=st;UI.secReset=false}
  }
  renderInspector(force);measureCover();
  if(fsel){const el=document.querySelector(fsel);if(el)el.focus({preventScroll:true})}
}

/* ================= save / load ================= */
// numbers are trimmed to three decimals and walking paths are dropped, which makes saves about a fifth smaller
const packSave=()=>JSON.stringify({format:'martian-hollow',version:SAVE_VERSION,savedAt:Date.now(),state:S},(k,v)=>typeof v==='number'?(Number.isInteger(v)?v:Math.round(v*1000)/1000):k==='path'?[]:k==='goalKey'?'':v);
/* big colonies don't fit in the browser's small save space, so saves are compressed (about 8 times smaller)
   and kept in the browser's database, which has far more room. The small space keeps a compressed copy too. */
const canZip=()=>typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined'&&typeof Response!=='undefined';
async function gz(txt){return new Uint8Array(await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer())}
async function gunz(bytes){return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
function unb64(str){const s=atob(str),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function packCode(txt){txt=txt||packSave();if(!canZip())return'MH:'+txt;return'MHZ:'+b64(await gz(txt))}
async function unpackCode(code){code=String(code).trim();if(code.startsWith('MHZ:')){if(!canZip())throw new Error('This browser is too old to open compressed saves');return await gunz(unb64(code.slice(4).replace(/\s+/g,'')))}return code.replace(/^\s*MH:/,'')}
const SAVE_DB='martian-hollow',SAVE_STORE='saves';
function idbOpen(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej(new Error('no database'));let r;try{r=indexedDB.open(SAVE_DB,1)}catch(e){return rej(e)}
  r.onupgradeneeded=()=>r.result.createObjectStore(SAVE_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
async function idbPut(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction(SAVE_STORE,'readwrite');t.objectStore(SAVE_STORE).put(v,k);t.oncomplete=()=>{db.close();res()};t.onerror=t.onabort=()=>{db.close();rej(t.error||new Error('write failed'))}})}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction(SAVE_STORE,'readonly'),q=t.objectStore(SAVE_STORE).get(k);q.onsuccess=()=>{db.close();res(q.result)};q.onerror=()=>{db.close();rej(q.error)}})}
function loadState(raw){
  const s=migrateSave(raw);S=s;sanitizeLoaded();
  UI.sel=null;UI.buildType=null;UI.logSeen=-1;UI.mapVer++;focusHome();refreshUI(true);
}
const inClaude=()=>typeof window!=='undefined'&&!!window.storage;
function localStore(){try{if(typeof window==='undefined'||inClaude()||!window.localStorage)return null;const k='__mh_test';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return window.localStorage}catch(e){return null}}
async function saveGame(silent){
  if(UI.saving)return;UI.saving=true;
  try{
    const txt=packSave(),code=await packCode(txt);
    if(inClaude()){
      try{await window.storage.set(SAVE_KEY,code,false);UI.lastSaved=Date.now();if(!silent)toast('Colony saved.','joy')}
      catch(e){if(!silent)toast('Could not save just now. Try again in a moment.','warn')}
      return;
    }
    let ok=false;
    try{await idbPut(SAVE_KEY,code);ok=true}catch(e){}
    const ls=localStore();
    if(ls){try{ls.setItem(SAVE_KEY,code);ok=true}catch(e){try{ls.removeItem(SAVE_KEY)}catch(e2){}}for(const k of LEGACY_SAVE_KEYS)try{ls.removeItem(k)}catch(e){}}
    if(ok){UI.lastSaved=Date.now();if(!silent)toast('Colony saved on this device.','joy')}
    else if(!silent)toast('This browser would not save the colony. Keep a backup from Tasks, Settings, Your save.','warn');
  }catch(e){if(!silent)toast('Could not save just now. Try again in a moment.','warn')}
  finally{UI.saving=false}
}
async function readStored(){
  if(inClaude()){for(const key of [SAVE_KEY,...LEGACY_SAVE_KEYS]){try{const r=await window.storage.get(key,false);if(r&&r.value)return await unpackCode(r.value)}catch(e){}}return null}
  // the database and the small space can each hold a copy: use whichever is newest
  const found=[];
  try{const v=await idbGet(SAVE_KEY);if(v)found.push(await unpackCode(v))}catch(e){}
  const ls=localStore();
  if(ls)for(const key of [SAVE_KEY,...LEGACY_SAVE_KEYS]){try{const v=ls.getItem(key);if(v){found.push(await unpackCode(v));break}}catch(e){}}
  if(!found.length)return null;
  const when=t=>{const m=/"savedAt":(\d+)/.exec(t.slice(0,200));return m?+m[1]:0};
  return found.sort((a,b)=>when(b)-when(a))[0];
}
async function loadGame(){
  const txt=await readStored();if(!txt)return false;
  try{loadState(JSON.parse(txt));return true}catch(e){toast(`That save could not be opened: ${e.message}`,'warn');return false}
}
async function hasSave(){return !!(await readStored())}
async function importSave(txt){
  try{const raw=JSON.parse(await unpackCode(txt));loadState(raw);closeModal();UI.booted=true;saveGame(true);toast(`Restored ${S.colony}.`,'joy')}
  catch(e){toast(e instanceof SyntaxError?'That backup code is incomplete. Copy the whole thing and try again.':`That save could not be opened: ${e.message}`,'warn')}
}
function downloadSave(){
  try{const blob=new Blob([packSave()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`${S.colony.replace(/\s+/g,'-').toLowerCase()}-sol-${solNum()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
  catch(e){toast('Downloads are blocked here. Copy the backup code instead.','warn')}
}
function openBackup(){
  openModal(`<h2>Back up or restore</h2>
    <p>This code holds your whole colony. Keep it somewhere safe. Paste it into any version of the game, including future updates, to carry on where you left off.</p>
    <textarea id="saveCode" class="code" readonly>Preparing your code...</textarea>
    <div class="actions"><button class="btn small" data-act="export-copy">Copy code</button><button class="btn small soft" data-act="export-dl">Download as a file</button></div>
    <h3>Restore a colony</h3><p class="sub">This replaces the colony you have open now.</p>
    <textarea id="importCode" class="code" placeholder="Paste a backup code here"></textarea>
    <div class="actions"><button class="btn small" data-act="import">Restore from code</button>
    <label class="btn small soft" style="cursor:pointer">Open a file<input type="file" accept=".json,application/json,text/plain" data-act="importfile" hidden></label>
    <button class="ghost" data-act="close-modal">Close</button></div>`,{pause:true});
  packCode().then(c=>{const ta=$('#saveCode');if(ta)ta.value=c}).catch(()=>{const ta=$('#saveCode');if(ta)ta.value='MH:'+packSave()});
}
function showDilemma(d){
  if(!$('#modal').hidden){toast('A decision is waiting in the Tasks tab.','law');return}
  const v=DIL[d.key].view(d.ctx);
  openModal(`<h2>${esc(v.title)}</h2><p>${esc(v.text)}</p>
    ${v.opts.map((o,i)=>`<button class="choice" data-act="dil" data-id="${d.id}" data-o="${i}"><strong>${esc(o.label)}</strong><span class="d">${esc(o.hint)}</span></button>`).join('')}
    <div class="actions"><button class="ghost" data-act="dil-later">Decide later</button></div>`);
}
function showYearbook(y){
  openModal(`<h2>Year ${y.year} in ${esc(S.colony)}</h2><div class="story">${y.paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
    ${y.star?`<p class="note">Martian of the year: <b>${esc(y.star.name)}</b>${y.star.job?`, ${esc(y.star.job)}`:''} of the ${esc(y.star.line)} line.</p>`:''}
    <div class="actions"><button class="btn" data-act="close-modal">On to Year ${y.year+1}</button></div>`);
}
function updateSoundBtn(){const b=$('#soundBtn');if(!b)return;const st=S.settings;b.textContent=st.music?'♪ Sound on':st.sfx?'♪ Effects only':'♪ Sound off';b.setAttribute('aria-pressed',String(!!(st.music||st.sfx)))}
function focusHome(){const hm=allC().find(c=>c.home)||allC()[0];if(hm){const h=B(hm.hearth);focusOn(h?h.tx+0.5:hm.cx,h?h.ty+0.5:hm.cy)}else focusOn(MAP_W/2,MAP_H/2)}
function showIntro(saved){
  openModal(`<h2>Welcome to ${esc(S.colony)}</h2>
    <p>Seven founders have dug the first burrows under the butterscotch sky. Help them grow into a colony with its own trades, classes, and laws.</p>
    <ul><li>Pick a building in Build, then click open ground on the map.</li>
    <li>Click any martian to see their needs, skills, and standing, and to give them a calling.</li>
    <li>Research Sporecraft so martians can bud when the colony needs more hands.</li>
    <li>Raise a Concord Hall to change laws. The council votes on every change.</li>
    <li>Martians invent new tools and whole new callings as they work. Develop their ideas in the Ideas tab.</li>
    <li>Explore the fog. Young martians will set out to found communities of their own.</li>
    <li>Seasons turn every six sols. Stock up before winter.</li></ul>
    <p class="sub">Drag the map to look around and scroll or pinch to zoom. Space pauses, keys 1 to 3 change speed, and Esc cancels building.</p>
    <div class="actions">${saved?'<button class="btn" data-act="loadsave">Continue your saved colony</button><button class="ghost" data-act="begin">Start a new one</button>':'<button class="btn" data-act="begin">Begin</button><button class="ghost" data-act="reroll">Choose another name</button>'}<button class="ghost" data-act="backup">Restore from a backup</button></div>`);
}

/* ================= wiring & loop ================= */
function evtPos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function boot(){
  setupColony();
  resize();
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(cv.parentElement);
  window.addEventListener('resize',resize);
  document.addEventListener('pointerdown',()=>{UI.pointerDown=true;UI.lastInput=performance.now();if(UI.booted)resumeAudio()},true);
  for(const sel of ['#panel','#inspector'])$(sel).addEventListener('scroll',()=>{UI.lastScroll=performance.now()},{passive:true});
  if(typeof matchMedia!=='undefined')matchMedia(PHONE_Q).addEventListener?.('change',()=>{resize();refreshUI(true)});
  document.addEventListener('pointerup',()=>{setTimeout(()=>{UI.pointerDown=false},0)},true);
  document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;if(el.disabled)return;act(el,e)});
  document.addEventListener('change',e=>{const el=e.target.closest('[data-act]');if(el)onChange(el)});
  document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('ledger'))UI.ledgerOpen=e.target.open},true);
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{UI.tab=b.dataset.tab;UI.secReset=true;$('#panel').scrollTop=0;refreshUI(true)}));
  document.querySelectorAll('.speed button').forEach(b=>b.addEventListener('click',()=>{S.speed=+b.dataset.speed;refreshUI(true)}));
  $('#saveBtn').addEventListener('click',()=>saveGame(false));
  updateSoundBtn();
  // drag to pan, wheel or pinch to zoom; the camera angle itself never changes
  const touches=new Map();
  cv.addEventListener('pointerdown',e=>{touches.set(e.pointerId,evtPos(e));cv.setPointerCapture(e.pointerId);
    if(touches.size===1)UI.drag={x:e.clientX,y:e.clientY,fx:CAM.fx,fy:CAM.fy,moved:false};
    else if(touches.size===2){const [a,b]=[...touches.values()];UI.pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};if(UI.drag)UI.drag.moved=true}});
  cv.addEventListener('pointermove',e=>{
    const p=evtPos(e);UI.mouse=p;UI.lastInput=performance.now();
    if(touches.has(e.pointerId))touches.set(e.pointerId,p);
    if(touches.size===2&&UI.pinch){const [a,b]=[...touches.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(d>10){zoomAt({x:(a.x+b.x)/2,y:(a.y+b.y)/2},d/UI.pinch.d);UI.pinch.d=d}return}
    if(UI.drag&&touches.size===1){const dx=e.clientX-UI.drag.x,dy=e.clientY-UI.drag.y;
      if(!UI.drag.moved&&Math.hypot(dx,dy)>6){UI.drag.moved=true;cv.style.cursor='grabbing';UI.follow=null}
      if(UI.drag.moved){CAM.fx=UI.drag.fx;CAM.fy=UI.drag.fy;panBy(dx,dy)}}
    UI.hover=hitTest(p);
  });
  const endPtr=e=>{touches.delete(e.pointerId);if(touches.size<2)UI.pinch=null;if(!touches.size){UI.dragMoved=!!(UI.drag&&UI.drag.moved);UI.drag=null;cv.style.cursor=''}};
  cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
  cv.addEventListener('pointerleave',()=>{if(!UI.drag){UI.mouse=null;UI.hover=null}});
  cv.addEventListener('wheel',e=>{e.preventDefault();UI.lastInput=performance.now();zoomAt(evtPos(e),e.deltaY<0?1.1:1/1.1)},{passive:false});
  cv.addEventListener('click',e=>{
    if(UI.dragMoved){UI.dragMoved=false;return}
    const p=evtPos(e),h=hitTest(p);
    if(UI.buildType){if(h&&h.kind==='tile')placeBuilding(UI.buildType,h.tx,h.ty)}
    else if(h&&h.kind==='m')UI.sel={kind:'m',id:h.id};
    else if(h&&h.kind==='b')UI.sel={kind:'b',id:h.id};
    else if(h&&h.kind==='rock')UI.sel={kind:'rock',tx:h.tx,ty:h.ty};
    else if(h&&h.kind==='feat')UI.sel={kind:'feat',tx:h.tx,ty:h.ty};
    else if(h&&h.kind==='tile'&&!UI.buildType&&seen(h.tx,h.ty)&&N_(natAt(h.tx,h.ty))&&N_(natAt(h.tx,h.ty)).met){UI.sel=null;UI.secSel['tab:nations']='n'+natAt(h.tx,h.ty);openSheet('nations')}
    else{if(UI.phone&&!UI.sel&&UI.sheet)UI.sheet=false;UI.sel=null}
    if(UI.phone&&UI.sel&&!UI.buildType){const s=UI.sel,m=s.kind==='m'&&M(s.id),b=s.kind==='b'&&B(s.id);UI.glide=m?{x:m.x,y:m.y}:b?{x:b.tx+b.size/2,y:b.ty+b.size/2}:s.tx!=null?{x:s.tx+0.5,y:s.ty+0.5}:null}
    UI.confirm=null;refreshUI(true);
  });
  document.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('input,select,textarea,button,summary'))return;
    if(!$('#modal').hidden)return;
    if(e.code==='Space'){e.preventDefault();S.speed=S.speed?0:(UI.lastSpeed||1);if(S.speed)UI.lastSpeed=S.speed;refreshUI(true)}
    else if(e.key==='1'||e.key==='2'||e.key==='3'){S.speed=[1,2,4][+e.key-1];UI.lastSpeed=S.speed;refreshUI(true)}
    else if(e.key==='Escape'){if(!UI.sel&&!UI.buildType)UI.sheet=false;UI.buildType=null;UI.sel=null;refreshUI(true)}
    else if(e.key==='+'||e.key==='='){zoomAt({x:UI.cw/2,y:UI.ch/2},1.2)}
    else if(e.key==='-'){zoomAt({x:UI.cw/2,y:UI.ch/2},1/1.2)}
  });
  focusHome();
  if(!inClaude()&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!UI.modalPause)saveGame(true)});
  window.addEventListener('pagehide',()=>saveGame(true));
  refreshUI(true);
  showIntro(false);
  hasSave().then(s=>{UI.hasSave=s;if(s&&!$('#modal').hidden&&UI.modalPause&&!UI.traveler)showIntro(true)});
  let last=performance.now(),acc=0,lastDraw=-1e9;
  function frame(now){
    const dt=Math.min(250,now-last);last=now;
    const running=S.speed>0&&!UI.modalPause;
    if(running){acc+=dt*S.speed;let n=0;while(acc>=TICK_MS&&n<24){simTick();acc-=TICK_MS;n++}if(n>=24)acc=0}
    const alpha=running?clamp(acc/TICK_MS,0,1):1;
    const busy=running||UI.drag||UI.pinch||UI.glide||UI.follow||Math.abs((CAM.sy||0)-(UI.lastSy||0))>0.5||now-(UI.lastInput||0)<1500;UI.lastSy=CAM.sy||0;
    if(now-lastDraw>=1000/(busy?GFX.fps:GFX.idleFps)-6){lastDraw=now;try{draw(alpha,now)}catch(err){console.error(err)}}
    if(now-UI.lastUI>GFX.uiMs){UI.lastUI=now;refreshUI(false)}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
